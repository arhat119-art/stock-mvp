<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">

<title>台股狩獵場 v2</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   基本
========================= */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  color:#222;
  opacity:0;
  animation:pageIn .45s ease forwards;
}

@keyframes pageIn{
  from{
    opacity:0;
  }
  to{
    opacity:1;
  }
}


/* =========================
   Loading 畫面
========================= */

#loadingScreen{
  position:fixed;
  inset:0;
  z-index:99999;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at 50% 40%,
      #1e293b 0%,
      #111827 45%,
      #020617 100%
    );

  color:#fff;

  overflow:hidden;

  transition:
    opacity .45s ease,
    visibility .45s ease;
}

#loadingScreen.hide{
  opacity:0;
  visibility:hidden;
}

.loading-glow{
  position:absolute;

  width:280px;
  height:280px;

  border-radius:50%;

  background:rgba(96,165,250,.13);

  filter:blur(65px);

  animation:
    glowMove 3s ease-in-out infinite alternate;
}

.loading-content{
  position:relative;
  text-align:center;
}

.loading-logo{
  font-size:30px;
  font-weight:800;
  letter-spacing:2px;
}

.loading-version{
  margin-top:5px;
  color:#94a3b8;
  font-size:13px;
}

.loader{
  width:32px;
  height:32px;

  margin:28px auto 16px;

  border:3px solid rgba(255,255,255,.18);
  border-top-color:#fff;

  border-radius:50%;

  animation:spin .8s linear infinite;
}

.loading-text{
  font-size:13px;
  color:#94a3b8;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@keyframes glowMove{

  from{
    transform:
      translate(-35px,-15px)
      scale(.9);
  }

  to{
    transform:
      translate(35px,20px)
      scale(1.12);
  }
}


/* =========================
   Header
========================= */

header{
  background:#111827;
  color:#fff;

  padding:
    18px
    16px;

  box-shadow:
    0 3px 14px rgba(0,0,0,.12);
}

h1{
  margin:0;
  font-size:24px;
}

.sub{
  font-size:13px;
  opacity:.75;
  margin-top:4px;
}


/* =========================
   主要區域
========================= */

main{
  max-width:720px;
  margin:auto;
  padding:14px;
}


/* =========================
   卡片
========================= */

.card{
  background:#fff;

  border-radius:16px;

  padding:14px;

  margin-bottom:12px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.06);

  animation:
    cardIn .42s ease both;
}

@keyframes cardIn{

  from{
    opacity:0;
    transform:
      translateY(14px);
  }

  to{
    opacity:1;
    transform:
      translateY(0);
  }
}


/* =========================
   按鈕 / 輸入
========================= */

button,
input,
select,
textarea{
  font:inherit;
  box-sizing:border-box;
}

button{
  border:0;
  border-radius:9px;
  padding:9px 13px;
  cursor:pointer;

  transition:
    transform .12s ease,
    opacity .12s ease,
    box-shadow .12s ease;
}

button:active{
  transform:scale(.96);
}

button:hover{
  opacity:.9;
}

.primary{
  background:#111827;
  color:#fff;
}

.green{
  background:#16803c;
  color:#fff;
}

.red{
  background:#c62828;
  color:#fff;
}

.gray{
  background:#e5e7eb;
  color:#222;
}

input,
select,
textarea{
  width:100%;

  padding:10px;

  border:1px solid #d1d5db;

  border-radius:9px;

  background:#fff;

  outline:none;

  transition:
    border-color .15s ease,
    box-shadow .15s ease;
}

input:focus,
select:focus,
textarea:focus{

  border-color:#64748b;

  box-shadow:
    0 0 0 3px rgba(100,116,139,.12);
}

textarea{
  min-height:80px;
  resize:vertical;
}


/* =========================
   表單
========================= */

.form-grid{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;
}

.form-grid .full{
  grid-column:1/-1;
}

.tools{
  display:flex;

  gap:8px;

  flex-wrap:wrap;

  margin-bottom:12px;
}


/* =========================
   狀態
========================= */

.status{

  padding:4px 8px;

  border-radius:20px;

  background:#eef2ff;

  font-size:12px;

  white-space:nowrap;
}


/* =========================
   股票名稱
========================= */

.stock-title{

  font-size:18px;

  font-weight:700;
}


/* Yahoo 股票連結 */

.stock-link{

  display:inline-flex;

  align-items:center;

  gap:5px;

  color:inherit;

  text-decoration:none;

  transition:
    transform .15s ease,
    opacity .15s ease;
}

.stock-link:hover{
  opacity:.7;
}

.stock-link:active{
  transform:scale(.97);
}

.stock-code{

  color:#666;

  font-size:14px;

  font-weight:500;
}

.yahoo-icon{

  font-size:12px;

  color:#64748b;

  opacity:.8;
}


/* =========================
   排版
========================= */

.row{

  display:flex;

  justify-content:space-between;

  gap:10px;

  align-items:center;
}

.meta{

  color:#555;

  font-size:14px;

  line-height:1.7;

  margin-top:8px;
}

.actions{

  display:flex;

  gap:6px;

  margin-top:10px;
}

.hidden{
  display:none;
}

#loginBox{

  max-width:420px;

  margin:30px auto;
}

.small{

  font-size:13px;

  color:#666;
}

.message{

  margin-top:8px;

  color:#c62828;

  font-size:14px;
}


/* =========================
   搜尋區
========================= */

#search{

  flex:1;
  min-width:180px;
}

#filterStatus{

  min-width:130px;
}


/* =========================
   手機版
========================= */

@media(max-width:520px){

  header{
    padding:
      17px
      14px;
  }

  h1{
    font-size:23px;
  }

  main{
    padding:12px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-grid .full{
    grid-column:auto;
  }

  .row{
    align-items:flex-start;
  }

  header .row{
    align-items:center;
  }

  header button{
    padding:9px 11px;
  }

  .tools{
    width:100%;
  }

  #search{
    width:100%;
    flex:1 1 100%;
  }

  #filterStatus{
    width:100%;
  }
}

</style>
</head>


<body>


<!-- =========================
     Loading
========================= -->

<div id="loadingScreen">

  <div class="loading-glow"></div>

  <div class="loading-content">

    <div class="loading-logo">
      台股狩獵場
    </div>

    <div class="loading-version">
      v2
    </div>

    <div class="loader"></div>

    <div class="loading-text">
      正在載入口袋名單…
    </div>

  </div>

</div>



<header>

  <div class="row">

    <div>

      <h1>
        台股狩獵場 v2
      </h1>

      <div class="sub">

      </div>

    </div>


    <div>

      <button
        id="loginBtn"

        onclick="showLogin()"
      >
        管理員登入
      </button>


      <button
        id="logoutBtn"
        class="gray hidden"

        登出
      </button>

  </div>

</header>



<main>

    </label>

      id="loginEmail"
      type="email"
      placeholder="你的 Email"
    >

  </div>


  <div style="margin-bottom:10px">

    <label>
      密碼
    </label>

    <input
      id="loginPassword"
      type="password"

  <div class="tools">

    <button
      class="primary"

      登入
    </button>


    <button
      class="gray"
      onclick="hideLogin()"

      取消
    </button>

  </div>


  <div
    id="loginMessage"
    class="message"

</div>



<!-- =========================
     管理員新增區

<div
  id="adminPanel"

  <div class="row">

    <h2 style="margin:0">
      新增口袋標的
    </h2>

      </label>

      <input
        id="name"

    <div>

      <label>
        股票代號
      </label>

      <input
        id="symbol"
        placeholder="例如：2392"
      >

    </div>


    <div>

      <label>
        型態
      </label>

      <select id="pattern">

        <option value="">
          請選擇
        </option>

        <option>
          破底翻
        </option>

        <option>
