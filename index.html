<title>台股狩獵場 v2</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   台股狩獵場 v2
   深色交易工作台版
   功能維持原版，只強化視覺
========================================================= */

*{
  box-sizing:border-box;
}

html{
  background:#070d18;
}

body{
  margin:0;
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(30,64,175,.18),
      transparent 38%
    ),
    linear-gradient(
      180deg,
      #0b1220 0%,
      #080e19 42%,
      #060b13 100%
    );

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    sans-serif;

  color:#e5edf8;

  opacity:0;

  animation:
    pageIn .45s ease forwards;
}

@keyframes pageIn{
  from{
    opacity:0;
  }

  to{
    opacity:1;
  }
}


/* =========================================================
   Loading
========================================================= */

#loadingScreen{
  position:fixed;
  inset:0;

  z-index:99999;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at 50% 42%,
      #1d3557 0%,
      #0b1424 46%,
      #020617 100%
    );

  color:#fff;

  overflow:hidden;

  transition:
    opacity .45s ease,
    visibility .45s ease;
}

#loadingScreen.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loading-glow{
  position:absolute;

  width:280px;
  height:280px;

  border-radius:50%;

  background:rgba(59,130,246,.16);

  filter:blur(65px);

  animation:
    glowMove 3s ease-in-out infinite alternate;
}

.loading-content{
  position:relative;
  text-align:center;
}

.loading-logo{
  font-size:30px;
  font-weight:800;
  letter-spacing:2px;

  text-shadow:
    0 0 24px rgba(96,165,250,.35);
}

.loading-version{
  margin-top:5px;

  color:#94a3b8;

  font-size:13px;
}

.loader{
  width:32px;
  height:32px;

  margin:28px auto 16px;

  border:
    3px solid
    rgba(255,255,255,.14);

  border-top-color:#60a5fa;

  border-radius:50%;

  animation:
    spin .8s linear infinite;
}

.loading-text{
  font-size:13px;
  color:#94a3b8;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@keyframes glowMove{

  from{
    transform:
      translate(-35px,-15px)
      scale(.9);
  }

  to{
    transform:
      translate(35px,20px)
      scale(1.12);
  }
}


/* =========================================================
   Header
========================================================= */

header{

  background:
    linear-gradient(
      135deg,
      #111c2f,
      #0b1424
    );

  color:#fff;

  padding:18px 16px;

  border-bottom:
    1px solid
    rgba(96,165,250,.12);

  box-shadow:
    0 8px 30px rgba(0,0,0,.30);

  overflow:hidden;
}

header::after{
  content:"";

  position:absolute;

  width:180px;
  height:180px;

  right:-70px;
  top:-90px;

  border-radius:50%;

  background:
    rgba(59,130,246,.08);

  filter:blur(30px);

  pointer-events:none;
}

h1{
  margin:0;

  font-size:24px;

  letter-spacing:.5px;

  text-shadow:

.sub{

/* =========================================================

========================================================= */

/* =========================================================
   卡片
========================================================= */

.card{

    linear-gradient(
      145deg,
      rgba(20,31,49,.96),
      rgba(12,20,33,.96)

  border:
    1px solid
    rgba(148,163,184,.10);

  border-radius:17px;

  padding:15px;

  margin-bottom:12px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.025);

  animation:
    cardIn .42s ease both;

  backdrop-filter:blur(8px);
}

.card:hover{
  border-color:
    rgba(96,165,250,.18);
}

@keyframes cardIn{

  from{
    opacity:0;
    transform:
      translateY(14px);
  }

  to{
    opacity:1;
    transform:
      translateY(0);
  }

/* =========================================================
   按鈕
========================================================= */

button,
input,
select,
textarea{

}

button{

    1px solid

  padding:9px 13px;

  cursor:pointer;

    transform .12s ease,
    opacity .12s ease,

button:active{

}

button:hover{

/* 主要按鈕 */

/* =========================================================

input,

/* =========================================================

#search{

/* =========================================================

/* =========================================================

<script>


/* =========================================================
   Supabase 設定
========================================================= */

const SUPABASE_URL =
"https://dfzmpdllwggmowqxmfnm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MlI3Rkr5IbhQVmhUZV8Z6g_mNQ3r0fR";


const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let stocks = [];

let currentUser = null;

let editingId = null;


/* =========================================================
   Loading
========================================================= */

let loadingHidden = false;


function hideLoading(){

  if(loadingHidden){
    return;
  }

  loadingHidden = true;


  const screen =
    document.getElementById(
      "loadingScreen"
    );


  if(screen){

    screen.classList.add("hide");

  }

}


setTimeout(
  hideLoading,
  1200
);


/* =========================================================
   Yahoo 股市
========================================================= */

function yahooUrl(symbol){

  const code =
    String(symbol || "")
      .trim()
      .toUpperCase();


  if(
    !/^\d{4,6}$/.test(code)
  ){

    return "#";

  }


  return (
    "https://tw.stock.yahoo.com/quote/"
    +
    code
    +
    ".TW"
  );

}


/* =========================================================
   初始化
========================================================= */

async function init(){

  try{

    const {data} =
      await sb.auth.getSession();


    currentUser =
      data.session
      ? data.session.user
      : null;


    updateAuthUI();


    await loadData();


    sb.auth.onAuthStateChange(
      (_event,session)=>{

        currentUser =
          session
          ? session.user
          : null;


        updateAuthUI();

      }
    );

  }

  catch(error){

    console.error(
      "初始化失敗：",
      error
    );

  }

}


/* =========================================================
   載入資料
========================================================= */

async function loadData(){

  try{

    const {data,error} =
      await sb
        .from("pocket_stocks")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error){

      console.error(error);


      document.getElementById(
        "list"
      ).innerHTML =

        `<div class="card">
          讀取資料失敗：
          ${escapeHtml(error.message)}
        </div>`;

      return;

    }


    stocks =
      data || [];


    render();

  }

  catch(error){

    console.error(
      "讀取資料失敗：",
      error
    );

  }

}


/* =========================================================
   登入 UI
========================================================= */

function updateAuthUI(){

  const adminPanel =
    document.getElementById(
      "adminPanel"
    );


  const loginBtn =
    document.getElementById(
      "loginBtn"
    );


  const logoutBtn =
    document.getElementById(
      "logoutBtn"
    );


  const userStatus =
    document.getElementById(
      "userStatus"
    );


  if(currentUser){

    adminPanel
      .classList
      .remove("hidden");


    loginBtn
      .classList
      .add("hidden");


    logoutBtn
      .classList
      .remove("hidden");


    userStatus.textContent =
      "🔐 管理員已登入";

  }

  else{

    adminPanel
      .classList
      .add("hidden");


    loginBtn
      .classList
      .remove("hidden");


    logoutBtn
      .classList
      .add("hidden");


    userStatus.textContent =
      "目前為訪客模式";

  }


  render();

}


/* =========================================================
   登入視窗
========================================================= */

function showLogin(){

  document
    .getElementById("loginBox")
    .classList
    .remove("hidden");


  document
    .getElementById("loginEmail")
    .focus();

}


function hideLogin(){

  document
    .getElementById("loginBox")
    .classList
    .add("hidden");


  document
    .getElementById("loginMessage")
    .textContent="";

}


/* =========================================================
   登入
========================================================= */

async function login(){

  const email =
    document
      .getElementById(
        "loginEmail"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "loginPassword"
      )
      .value;


  const message =
    document
      .getElementById(
        "loginMessage"
      );


  message.textContent="";


  if(!email || !password){

    message.textContent =
      "請輸入 Email 和密碼";

    return;

  }


  const {error} =
    await sb.auth.signInWithPassword({

      email,

      password

    });


  if(error){

    message.textContent =
      "登入失敗：" +
      error.message;

    return;

  }


  document
    .getElementById(
      "loginPassword"
    )
    .value="";


  hideLogin();

}


/* =========================================================
   登出
========================================================= */

async function logout(){

  await sb.auth.signOut();

  clearForm();

}


/* =========================================================
   新增 / 修改
========================================================= */

async function addStock(){

  if(!currentUser){

    alert(
      "請先登入管理員帳號"
    );

    return;

  }


  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const symbol =
    document
      .getElementById("symbol")
      .value
      .trim();


  if(!name || !symbol){

    alert(
      "請至少輸入股票名稱與代號"
    );

    return;

  }


  const payload = {

    name:name,

    symbol:symbol,

    pattern:
      document
        .getElementById("pattern")
        .value,

    key_price:
      document
        .getElementById("keyPrice")
        .value
        .trim(),

    entry_price:
      document
        .getElementById("entryPrice")
        .value
        .trim(),

    stop_price:
      document
        .getElementById("stopPrice")
        .value
        .trim(),

    status:
      document
        .getElementById("status")
        .value,

    memo:
      document
        .getElementById("memo")
        .value
        .trim()

  };


  let result;


  if(editingId){

    result =
      await sb
        .from("pocket_stocks")
        .update(payload)
        .eq(
          "id",
          editingId
        );

  }

  else{

    result =
      await sb
        .from("pocket_stocks")
        .insert(payload);

  }


  if(result.error){

    alert(
      "儲存失敗：" +
      result.error.message
    );

    return;

  }


  clearForm();


  await loadData();

}


/* =========================================================
   編輯
========================================================= */

function editStock(id){

  if(!currentUser){

    alert(
      "請先登入管理員帳號"
    );

    return;

  }


  const stock =
    stocks.find(
      x =>
        String(x.id) ===
        String(id)
    );


  if(!stock){
    return;
  }


  editingId =
    stock.id;


  document
    .getElementById("name")
    .value =
      stock.name || "";


  document
    .getElementById("symbol")
    .value =
      stock.symbol || "";


  document
    .getElementById("pattern")
    .value =
      stock.pattern || "";


  document
    .getElementById("keyPrice")
    .value =
      stock.key_price || "";


  document
    .getElementById("entryPrice")
    .value =
      stock.entry_price || "";


  document
    .getElementById("stopPrice")
    .value =
      stock.stop_price || "";


  document
    .getElementById("status")
    .value =
      stock.status ||
      "watching";


  document
    .getElementById("memo")
    .value =
      stock.memo || "";


  document
    .querySelector(
      "#adminPanel"
    )
    .scrollIntoView({
      behavior:"smooth"
    });


  document
    .querySelector(
      "#adminPanel h2"
    )
    .textContent =
      "修改口袋標的";

}


/* =========================================================
   刪除
========================================================= */

async function deleteStock(id){

  if(!currentUser){

    alert(
      "請先登入管理員帳號"
    );

    return;

  }


  if(
    !confirm(
      "確定要刪除這個標的嗎？"
    )
  ){

    return;

  }


  const {error} =
    await sb
      .from("pocket_stocks")
      .delete()
      .eq("id",id);


  if(error){

    alert(
      "刪除失敗：" +
      error.message
    );

    return;

  }


  await loadData();

}


/* =========================================================
   清除表單
========================================================= */

function clearForm(){

  editingId=null;


  document
    .getElementById("name")
    .value="";


  document
    .getElementById("symbol")
    .value="";


  document
    .getElementById("pattern")
    .value="";


  document
    .getElementById("keyPrice")
    .value="";


  document
    .getElementById("entryPrice")
    .value="";


  document
    .getElementById("stopPrice")
    .value="";


  document
    .getElementById("status")

    .getElementById("memo")

/* =========================================================
   顯示股票列表
========================================================= */

function render(){

  const list =
    document.getElementById(
      "list"
    );


  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const filter =
    document
      .getElementById(
        "filterStatus"
      )
      .value;


  let result =
    stocks.filter(
      stock=>{

        const text =
          `${stock.name || ""} ${stock.symbol || ""}`
            .toLowerCase();


        const matchSearch =
          !search ||
          text.includes(search);


        const matchStatus =
          !filter ||
          stock.status === filter;


        return (
          matchSearch &&
          matchStatus
        );

      }
    );


  document
    .getElementById("count")
    .textContent =
      `（${result.length} 檔）`;


  if(result.length===0){

    list.innerHTML =

      `<div class="card small">
        目前沒有符合條件的標的。
      </div>`;

    return;

  }


  list.innerHTML =

    result.map(
      (stock,index)=>{

        const statusText = {

          watching:"觀察",

          ready:"準備進場",

          holding:"持有",

          closed:"已結束"

        }[
          stock.status
        ]
        ||
        stock.status
        ||
        "";


        const adminButtons =
          currentUser
          ?

          `

          <div class="actions">

            <button
              class="gray"
              onclick="editStock(${Number(stock.id)})"
            >
              ✏️ 編輯
            </button>


            <button
              class="red"
              onclick="deleteStock(${Number(stock.id)})"
            >
              🗑️ 刪除
            </button>

          </div>

          `

          : "";


        const yahoo =
          yahooUrl(
            stock.symbol
          );


        return `

        <div
          class="card"
          style="animation-delay:${index * 0.05}s"
        >

          <div class="row">

            <div class="stock-title">

              ${
                yahoo !== "#"

                ?

                `

                <a
                  class="stock-link"
                  href="${yahoo}"
                  target="_blank"
                  rel="noopener noreferrer"
                  title="前往 Yahoo 股市"
                >

                  ${escapeHtml(
                    stock.name || ""
                  )}

                  <span class="stock-code">

                    ${escapeHtml(
                      stock.symbol || ""
                    )}

                  </span>

                  <span class="yahoo-icon">
                    ↗
                  </span>

                </a>

                `

                :

                `

                ${escapeHtml(
                  stock.name || ""
                )}

                <span class="stock-code">

                  ${escapeHtml(
                    stock.symbol || ""
                  )}

                </span>

                `

              }

            </div>


            <span class="status">

              ${escapeHtml(
                statusText
              )}

            </span>

          </div>


          <div class="meta">

            ${
              stock.pattern

              ?

              `型態：
              ${escapeHtml(
                stock.pattern
              )}<br>`

              :

              ""
            }


            ${
              stock.key_price

              ?

              `關鍵價：
              ${escapeHtml(
                stock.key_price
              )}<br>`

              :

              ""
            }


            ${
              stock.entry_price

              ?

              `進場：
              ${escapeHtml(
                stock.entry_price
              )}<br>`

              :

              ""
            }


            ${
              stock.stop_price

              ?

              `停損：
              ${escapeHtml(
                stock.stop_price
              )}<br>`

              :

              ""
            }


            ${
              stock.memo

              ?

              `備註：
              ${escapeHtml(
                stock.memo
              )}`

              :

              ""
            }

          </div>


          ${adminButtons}

        </div>

        `;

      }

    ).join("");

}


/* =========================================================
   HTML 安全處理
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
