
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股狩獵場｜行情連線測試</title>
<style>
body {
  margin: 0;
  padding: 24px;
  background: #0b1220;
  color: #eef2ff;
  font-family: system-ui, sans-serif;
}
main {
  max-width: 600px;
  margin: auto;
}
.card {
  padding: 20px;
  border: 1px solid #344155;
  border-radius: 16px;
  background: #131d2e;
}
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border-radius: 10px;
  font-size: 16px;
}
input {
  color: #fff;
  background: #0b1220;
  border: 1px solid #526078;
}
button {
  color: #fff;
  background: #16845b;
  border: 0;
  font-weight: 700;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
}
.note {
  color: #b8c5d9;
  font-size: 14px;
}
</style>
</head>
<body>
<main>
  <h2>台股狩獵場｜行情連線測試</h2>
  <div class="card">
    <label for="symbol">台股代號</label>
    <input id="symbol" value="2330.TW">
    <button id="test">測試取得股價</button>
    <p id="status">等待測試</p>
    <pre id="result"></pre>
  </div>
  <p class="note">
    本頁僅供連線測試，不會讀取或修改口袋名單。
    資料來源：Yahoo Finance。
  </p>
</main>

<script>
const FUNCTION_URL =
  "https://dfzmpdllwggmowqxmfnm.supabase.co/functions/v1/yahoo-quote-test";

const button = document.getElementById("test");
const statusBox = document.getElementById("status");
const resultBox = document.getElementById("result");

button.addEventListener("click", async () => {
  const symbol = document.getElementById("symbol")
    .value.trim().toUpperCase();

  if (!symbol) {
    statusBox.textContent = "請輸入股票代號";
    return;
  }

  button.disabled = true;
  button.textContent = "測試中……";
  statusBox.textContent = "正在連線至行情函式";
  resultBox.textContent = "";

  try {
    const url = FUNCTION_URL + "?symbol=" +
      encodeURIComponent(symbol);

    const response = await fetch(url, {
      method: "GET"
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status + "\n" +
        JSON.stringify(data, null, 2)
      );
    }

    if (data.success !== true ||
        typeof data.price !== "number") {
      throw new Error(
        "回傳資料格式不符預期：\n" +
        JSON.stringify(data, null, 2)
      );
    }

    statusBox.textContent = "連線成功！";
    resultBox.textContent =
      "股票代號：" + data.symbol + "\n" +
      "測試股價：" + data.price + "\n" +
      "幣別：" + (data.currency || "TWD") + "\n" +
      "行情時間：" + (data.marketTime || "未提供") +
      "\n資料來源：" + (data.source || "Yahoo Finance") +
      "\n完整回傳：\n" +
      JSON.stringify(data, null, 2);

  } catch (error) {
    statusBox.textContent = "測試失敗";
    resultBox.textContent =
      String(error.message || error) +
      "\n\n若出現 Failed to fetch，可能是跨來源存取（CORS）" +
      "或網路連線問題，請截圖確認，不要先修改其他設定。";
  } finally {
    button.disabled = false;
    button.textContent = "測試取得股價";
  }
});
</script>
</body>
</html>
